<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Magic — CRM connection test</title>
<style>body{font:17px system-ui;background:#f5f5f5;color:#222;max-width:600px;margin:40px auto;padding:20px}form{background:white;padding:24px;border-radius:12px}label{display:block;margin-top:16px}input,textarea,button{font:inherit;box-sizing:border-box;width:100%;padding:10px;margin-top:6px}button{background:#222;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}#status{white-space:pre-wrap;overflow-wrap:anywhere}</style></head>
<body><h1>CRM connection test</h1><p>This page saves a test inquiry to Magic. It does not send email or sync Google Sheets yet. Use test details only.</p>
<form id="test">
<label>Name<input name="fullName" value="CRM TEST — delete after verification" required maxlength="250"></label>
<label>Email<input name="email" type="email" value="crm-test@example.com" required></label>
<label>Phone<input name="phone" type="tel" value="0500000000" required></label>
<input name="eventType" type="hidden" value="other"><input name="language" type="hidden" value="en">
<label>Message<textarea name="message" required>Controlled CRM connection test. Not a real customer inquiry.</textarea></label>
<div class="cf-turnstile" data-sitekey="0x4AAAAAAFNABQQiM51BgqJB" data-action="lead"></div>
<button type="submit">Save test inquiry</button><p id="status" role="status" aria-live="polite"></p>
</form>
<script>
const endpoint='https://diwkgshzirfttqemhwjc.supabase.co/functions/v1/submit-lead';
const form=document.getElementById('test'),status=document.getElementById('status'),button=form.querySelector('button');
let submissionId=crypto.randomUUID(),sending=false;
form.addEventListener('input',e=>{if(!sending&&e.target.name!=='cf-turnstile-response')submissionId=crypto.randomUUID();});
form.addEventListener('submit',async e=>{
 e.preventDefault();if(sending)return;
 if(location.origin!=='https://arielnoy27.github.io'){status.textContent='Upload this file to your Magic GitHub Pages site. Opening it locally will not work.';return;}
 const data=Object.fromEntries(new FormData(form));
 if(!data['cf-turnstile-response']){status.textContent='Wait for the security check to complete.';return;}
 data.turnstileToken=data['cf-turnstile-response'];delete data['cf-turnstile-response'];data.submissionId=submissionId;
 sending=true;button.disabled=true;const fields=[...form.querySelectorAll('input:not([type="hidden"]),textarea')];fields.forEach(f=>f.disabled=true);
 status.textContent='Saving test inquiry…';const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),20000);
 try{
 const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data),signal:controller.signal});
 const result=await response.json();
 status.textContent=response.ok&&result.ok===true?'Saved successfully. Now open Supabase → Table Editor → leads and find CRM TEST. Repeating this unchanged test should still produce only one row.':`HTTP ${response.status}: ${result.message||JSON.stringify(result)}`;
 }catch{status.textContent='Could not confirm receipt. Check the leads table before retrying. This page keeps the same test ID to avoid duplicate rows.';}
 finally{clearTimeout(timer);sending=false;button.disabled=false;fields.forEach(f=>f.disabled=false);if(window.turnstile)window.turnstile.reset();}
});
</script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</body></html>
